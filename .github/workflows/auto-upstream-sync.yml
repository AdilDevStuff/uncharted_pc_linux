name: Auto Upstream Sync & Linux Build

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build and release even if no new upstream commits'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  check-and-sync:
    name: Check Supermedo Upstream & Sync
    runs-on: ubuntu-24.04
    outputs:
      has_updates: ${{ steps.sync.outputs.has_updates }}
      tag_name: ${{ steps.sync.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and check for new commits
        id: sync
        run: |
          git remote add upstream https://github.com/Supermedo/uncharted_pc.git || true
          git fetch upstream main --tags
          
          UPSTREAM_COMMITS=$(git rev-list --count HEAD..upstream/main || echo 0)
          FORCE="${{ github.event.inputs.force_build }}"
          echo "Upstream commits ahead: $UPSTREAM_COMMITS (force=$FORCE)"
          
          if [ "$UPSTREAM_COMMITS" -gt 0 ] || [ "$FORCE" = "true" ]; then
            echo "New updates available from Supermedo/uncharted_pc."
            if [ "$UPSTREAM_COMMITS" -gt 0 ]; then
              # Merge upstream updates
              git merge upstream/main --no-edit -m "Auto-merge upstream Supermedo/uncharted_pc updates" || {
                # Prefer our Linux versions in case of conflict in README or Windows packaging
                git checkout --ours README.md 2>/dev/null || true
                git add README.md 2>/dev/null || true
                git commit -m "Auto-merge upstream with Linux compatibility preserved" || true
              }
              git push origin main
            fi
            
            # Extract version from launcher
            VERSION=$(grep -E "^VERSION = " launcher/uncharted_launcher.py | cut -d"'" -f2 || echo "0.3.9")
            TAG_NAME="v${VERSION}"
            
            # Check if tag already exists in origin; if so, append build timestamp to avoid collision
            if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
              TAG_NAME="v${VERSION}-linux-$(date +'%Y%m%d%H%M')"
            fi
            
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
            
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "No new upstream commits. Already up to date."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    name: Build Linux Version and Publish Release
    needs: check-and-sync
    if: needs.check-and-sync.outputs.has_updates == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-and-sync.outputs.tag_name }}
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libvulkan-dev libavcodec-dev libavutil-dev \
            libavformat-dev libswscale-dev libswresample-dev \
            libminiupnpc-dev libboost-dev libfmt-dev \
            libzydis-dev robin-map-dev libssl-dev zlib1g-dev \
            python3 python3-tk ruby ruby-dev rubygems rpm file wget \
            libasound2-dev libpulse-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libwayland-dev \
            libxkbcommon-dev libgl1-mesa-dev

      - name: Install FPM
        run: |
          sudo gem install --no-document fpm

      - name: Build and install SDL3 from source
        run: |
          git clone --depth 1 https://github.com/libsdl-org/SDL.git -b main
          cmake -S SDL -B build_sdl -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF
          sudo cmake --build build_sdl --target install -j$(nproc)
          sudo ldconfig

      - name: Set up AppImageTool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage
          cd /tmp && /tmp/appimagetool.AppImage --appimage-extract
          sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Build Native Binaries and Package Linux Version
        env:
          CC: gcc
          CXX: g++
        run: |
          TAG="${{ needs.check-and-sync.outputs.tag_name }}"
          bash packaging/linux/package_all.sh "$TAG"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uncharted-linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-and-sync.outputs.tag_name }}
          name: "Uncharted: The Nathan Drake Collection ${{ needs.check-and-sync.outputs.tag_name }} (Linux)"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS.txt
