name: Release Linux Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.3.6)'
        required: false
        default: 'v0.3.6'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build AppImage, DEB, and RPM
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libvulkan-dev libavcodec-dev libavutil-dev \
            libavformat-dev libswscale-dev libswresample-dev \
            libminiupnpc-dev libboost-dev libfmt-dev \
            libzydis-dev robin-map-dev libssl-dev zlib1g-dev \
            python3 python3-tk ruby ruby-dev rubygems rpm file wget \
            libasound2-dev libpulse-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libwayland-dev \
            libxkbcommon-dev libgl1-mesa-dev libxss-dev libxfixes-dev \
            libdrm-dev libgbm-dev libudev-dev

      - name: Install FPM
        run: |
          sudo gem install --no-document fpm

      - name: Build and install SDL3 from source
        run: |
          git clone --depth 1 https://github.com/libsdl-org/SDL.git -b main
          cmake -S SDL -B build_sdl -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_X11_XSCRNSAVER=OFF
          sudo cmake --build build_sdl --target install -j$(nproc)
          sudo ldconfig

      - name: Set up AppImageTool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage
          cd /tmp && /tmp/appimagetool.AppImage --appimage-extract
          sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Build Native Binaries and Package
        env:
          CC: gcc
          CXX: g++
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          bash packaging/linux/package_all.sh "$TAG"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uncharted-linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag_name != ''
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "Uncharted: The Nathan Drake Collection ${{ github.event.inputs.tag_name || github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS.txt
